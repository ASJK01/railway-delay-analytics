<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indian Railways Delay Analytics</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#1f4e79;color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:24px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1;min-width:170px;background:#fff;border-radius:8px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kpi h3{margin:0 0 6px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}
.kpi div{font-size:24px;font-weight:700}
.filters{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters label{font-weight:600;font-size:14px}
#search{padding:8px;border:1px solid #ccc;border-radius:4px;width:180px}
.chip{padding:6px 12px;margin:2px;border:1px solid #1f4e79;background:#fff;color:#1f4e79;border-radius:16px;cursor:pointer;font-size:13px}
.chip.on{background:#1f4e79;color:#fff}
#reset{padding:8px 18px;background:#c62828;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600}
#active-filter{font-size:13px;color:#c62828;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:8px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>

<header><h1>Indian Railways Delay Analytics Dashboard</h1></header>
<div class="wrap">

<div class="kpi"><h3>On-Time Rate</h3><div id="kpi-ontime" style="color:#1565c0">-</div></div>
<div class="kpi"><h3>Worst Train Type</h3><div id="kpi-worst" style="color:#f57f17;font-size:15px">-</div></div>
</div>
<div class="filters">
<label>Search train no:</label><input id="search" type="text" placeholder="e.g. 12805">
<label>Types:</label><span id="type-chips"></span>
<button id="reset">Reset Filters</button>
<span id="active-filter"></span>
</div>
<div class="grid">
<div class="card"><div id="chart1" style="height:340px"></div></div>

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const CONFIG={responsive:true,displaylogo:false};
let state={search:'',types:new Set(),click:null};
const types=[...new Set(DATA.map(d=>d.train_type))];
const chipBox=document.getElementById('type-chips');
types.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.dataset.type=t;
b.onclick=()=>{state.types.has(t)?state.types.delete(t):state.types.add(t);renderAll();};chipBox.appendChild(b);});
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function filtered(){let d=DATA;
if(state.search)d=d.filter(r=>String(r.train_number).includes(state.search));
if(state.types.size)d=d.filter(r=>state.types.has(r.train_type));
if(state.click)d=d.filter(r=>r[state.click.field]===state.click.value);

function layout(t,extra){const l={title:t,margin:{l:44,r:16,t:44,b:36},paper_bgcolor:'#ffffff',plot_bgcolor:'#fafafa',transition:{duration:500,easing:'cubic-in-out'},font:{size:12}};if(extra)Object.assign(l,extra);return l;}
function renderAll(){const d=filtered();

let worst='N/A',wv=-1;Object.keys(bt).forEach(k=>{const m=mean(bt[k]);if(m>wv){wv=m;worst=k;}});
document.getElementById('kpi-worst').textContent=worst;
document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',state.types.has(c.dataset.type)));
document.getElementById('active-filter').textContent=state.click?('Click-filter: '+state.click.field+' = '+state.click.value+' (click same bar again to clear)'):'';

const zA=Object.keys(z).map(k=>[k,mean(z[k])]).sort((a,b)=>b[1]-a[1]).slice(0,10);
const c={};d.forEach(r=>{c[r.primary_delay_cause]=(c[r.primary_delay_cause]||0)+1;});
const cA=Object.keys(c).map(k=>[k,c[k]]).sort((a,b)=>b[1]-a[1]).slice(0,10);
const p=[];

return Promise.all(p);}
function bindClick(id,field){document.getElementById(id).on('plotly_click',ev=>{const v=ev.points[0].x;
if(state.click&&state.click.field===field&&state.click.value===v)state.click=null;else state.click={field:field,value:v};renderAll();});}
